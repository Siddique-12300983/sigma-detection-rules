title: Windows Defender Exclusion Added
id: 1a3ec5dc-5006-4a27-9dbd-f032c25e26fe
status: experimental
description: >
  Detects a change to Microsoft Defender settings that adds a path, process or
  extension exclusion (Event ID 5007 in the Defender Operational log). Attackers
  add an exclusion so their tools can run from a folder Defender ignores. In my
  own lab this fired when I excluded the Rubeus folder before a Kerberoasting
  test, which is exactly the behaviour this rule is meant to catch.
references:
  - https://attack.mitre.org/techniques/T1562/001/
  - https://learn.microsoft.com/en-us/microsoft-365/security/defender-endpoint/troubleshoot-microsoft-defender-antivirus
author: Md Abu Bakar Siddique (ruxcipher)
date: 2026/10/25
tags:
  - attack.defense_evasion
  - attack.t1562.001
logsource:
  product: windows
  service: windefend
detection:
  selection:
    EventID: 5007
    New Value|contains: '\Exclusions\'
  condition: selection
falsepositives:
  - Administrators or endpoint software legitimately adding an exclusion.
level: medium
