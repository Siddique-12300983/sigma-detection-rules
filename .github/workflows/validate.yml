name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: pip install yamllint pysigma sigma-cli pysigma-backend-splunk

      - name: YAML lint
        run: yamllint -c .yamllint rules/

      - name: Sigma structure check
        run: python validate.py

      - name: sigma check
        run: sigma check rules/

      - name: Convert every rule (compile check)
        run: |
          for r in rules/*.yml; do
            echo "== $r =="
            sigma convert -t splunk --without-pipeline "$r"
          done
